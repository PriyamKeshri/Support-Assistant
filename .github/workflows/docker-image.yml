# Builds the API image on every push to main and publishes it to GitHub Packages:
#   docker pull ghcr.io/priyamkeshri/support-assistant:latest
name: Docker image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags each image "latest" and with its commit, and adds the labels that link the
      # package to this repository, so it shows under Packages on the repo page.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/priyamkeshri/support-assistant
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
