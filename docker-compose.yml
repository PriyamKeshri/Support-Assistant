services:
  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: support
      POSTGRES_PASSWORD: support
      POSTGRES_DB: support
    ports:
      - "5433:5432"   # 5433 on the host, so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support -d support"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://support:support@db:5432/support
      # From .env. Inside the container "localhost" is the container itself, so a model server on
      # your machine needs DOCKER_LLM_BASE_URL (e.g. http://host.docker.internal:11434/v1 for Ollama).
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-${LLM_BASE_URL:-}}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - models:/models   # Hugging Face model cache, so models download once
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  models:
