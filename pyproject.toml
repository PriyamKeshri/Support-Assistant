[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-support-assistant"
version = "0.1.0"
description = "IT help desk assistant: hybrid search over policy PDFs with Postgres + pgvector, reranking and evals."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pgvector>=0.3",
    "sentence-transformers>=3.0",
    "pypdf>=5.0",
    "openai>=1.40",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "reportlab>=4.2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs Postgres running with the sample policies ingested"]
